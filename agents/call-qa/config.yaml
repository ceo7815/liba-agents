agent:
  name: call-qa
  # Liba OS agents.slug (seeded as call-control). Hermes profile stays call-qa.
  os_slug: call-control
  description: Analyze insurance sales/service call recordings and produce QA scores.

model:
  name: gpt-5.6-sol
  provider: openai-api

source:
  # voicenter = PUSH CDR inbox (Sofia / LvMpqlBj) — preferred for transcripts
  # upload/os_pending = Liba OS direct uploads via calls.get_pending
  # drive = shared folder (disabled for now)
  type: voicenter
  local_dir: ../../inbox
  drive:
    folder_id: 1PQYaDHFbJDqBWnBn0B4cbnVYPOdCo9Fg
    folder_url: https://drive.google.com/drive/folders/1PQYaDHFbJDqBWnBn0B4cbnVYPOdCo9Fg
    cache_dir: ../../inbox/drive-cache
  upload:
    cache_dir: ../../inbox/upload-cache
  voicenter:
    cache_dir: ../../inbox/voicenter-audio
    extension: LvMpqlBj
    agent_name: סופיה

os:
  # mock = JSON files. http = POST LIBA_OS_BASE_URL/api/mcp (Bearer LIBA_OS_API_KEY)
  mode: http
  mock_dir: ../../mock_os_data
  base_url: http://localhost:3000

stt:
  # openai = gpt-4o-transcribe (מילים מדויקות) + תיוג סוכן/לקוח בלי לשכתב
  # openai-diarize = המודל הישן עם הפרדת דוברים מובנית (פחות מדויק בעברית)
  provider: openai
  language: auto
  diarization: true
