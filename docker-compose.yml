services:
  liba-agents:
    build: .
    container_name: liba-agents
    restart: unless-stopped
    ports:
      # Host 8082: 8080 is already taken on the Liba Insurance VPS
      # (same leftover as liba-site). In xCloud pick 8082 as primary port.
      - "8082:8080"
    environment:
      LIBA_OS_BASE_URL: ${LIBA_OS_BASE_URL:-}
      LIBA_OS_API_KEY: ${LIBA_OS_API_KEY:-}
      SOCIAL_PUBLISH_ENABLED: ${SOCIAL_PUBLISH_ENABLED:-0}
      SOCIAL_DRY_RUN: ${SOCIAL_DRY_RUN:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      VOICENTER_API_CODE: ${VOICENTER_API_CODE:-}
      VOICENTER_EXTENSION: ${VOICENTER_EXTENSION:-LvMpqlBj}
      VOICENTER_USER_ID: ${VOICENTER_USER_ID:-211361}
      VOICENTER_AGENT_NAME: ${VOICENTER_AGENT_NAME:-}
      VOICENTER_REQUIRE_ANSWER: ${VOICENTER_REQUIRE_ANSWER:-1}
      VOICENTER_REQUIRE_RECORDING: ${VOICENTER_REQUIRE_RECORDING:-0}
      VOICENTER_TOPIC_FILTER: ${VOICENTER_TOPIC_FILTER:-0}
      VOICENTER_WEBHOOK_TOKEN: ${VOICENTER_WEBHOOK_TOKEN:-}
      CALL_QA_VOICENTER_ENABLED: ${CALL_QA_VOICENTER_ENABLED:-0}
      CALL_QA_ANALYZE_ENABLED: ${CALL_QA_ANALYZE_ENABLED:-0}
